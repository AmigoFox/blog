services:
  web:
    build: .
    env_file: .env
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      - data:/app/data
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn blog.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 1 \
          --threads 4 \
          --timeout 60
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  data:
